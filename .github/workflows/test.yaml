name: Test
run-name: "Test ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  push:

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        neovim-version: ["0.9.5", "0.10.4", "0.11.6", "0.12.0"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Mise
        uses: jdx/mise-action@v2

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            .test-config/nvim/pack
          key: nfnl-${{ hashFiles('script/setup-test-deps') }}
          restore-keys: nfnl-

      - name: Test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mise run -t aqua:neovim/neovim@${{ matrix.neovim-version }} test
